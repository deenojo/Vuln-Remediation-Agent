name: scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Install scanners (pinned + sha256-verified)
        run: bash scanner/install_tools.sh trivy syft osv-scanner

      - name: Run scans + ingest
        run: bash scanner/run_scans.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: |
            reports/
            data/findings.db
