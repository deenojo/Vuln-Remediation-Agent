name: dashboard

# Nightly: scan -> triage -> record into the persistent findings DB -> publish the dashboard.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write    # push the DB to the metrics branch
  pages: write
  id-token: write

concurrency:
  group: metrics-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Install scanners (pinned + sha256-verified)
        run: bash scanner/install_tools.sh trivy syft osv-scanner

      - run: bash scanner/metrics_db.sh restore
      - run: bash scanner/run_scans.sh
      - run: patchwarden triage --code-root targets/demo-vulnerable-app
      - run: bash scanner/metrics_db.sh save
      - run: patchwarden report --out site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
