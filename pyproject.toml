[project]
name = "vuln-remediation-agent"
version = "0.1.0"
description = "Patchwarden: AI agent that triages and auto-remediates dependency and container vulnerabilities end to end."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "packaging>=23"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]

[project.scripts]
vra = "vra.cli:main"
patchwarden = "vra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
