<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" width="820" height="452" role="img" aria-label="Patchwarden architecture: scan, triage agent, policy gate, auto-fix or human review, verify, deploy, dashboard">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/><stop offset="1" stop-color="#eefbf7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#ffffff;stroke:#c3c7ce;stroke-width:1.3}
      .hl{fill:#e7f0fc;stroke:#3b82f6;stroke-width:2.2}
      .line{fill:none;stroke:#64748b;stroke-width:1.3}
      .name{font:600 15px Inter,'Segoe UI',system-ui,-apple-system,sans-serif;fill:#1f2328;text-anchor:middle}
      .sub{font:400 13px Inter,'Segoe UI',system-ui,-apple-system,sans-serif;fill:#334155;text-anchor:middle}
      .lbl{font:400 13px Inter,'Segoe UI',system-ui,-apple-system,sans-serif;fill:#475569;font-weight:500}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="451" rx="12" fill="url(#bgg)" stroke="#c7d2fe"/>

  <!-- trigger -->
  <text class="lbl" x="92" y="28" text-anchor="middle">Nightly, on PR, new CVE</text>
  <path class="line" d="M92 36V58" marker-end="url(#arrow)"/>

  <!-- connectors -->
  <path class="line" d="M175 92H198" marker-end="url(#arrow)"/>
  <path class="line" d="M367 92H398" marker-end="url(#arrow)"/>
  <path class="line" d="M546 92H622" marker-end="url(#arrow)"/>
  <path class="line" d="M472 141V224" marker-end="url(#arrow)"/>
  <path class="line" d="M708 124V224" marker-end="url(#arrow)"/>
  <path class="line" d="M557 242H624" marker-end="url(#arrow)"/>
  <path class="line" d="M624 270H559" marker-end="url(#arrow)"/>
  <path class="line" d="M708 290V368" marker-end="url(#arrow)"/>
  <path class="line" d="M624 401H559" marker-end="url(#arrow)"/>

  <!-- Scan -->
  <rect fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" x="9" y="61" width="166" height="62" rx="7"/>
  <text class="name" x="92" y="86">Scan</text>
  <text class="sub" x="92" y="106">Trivy, OSV, Syft</text>

  <!-- Triage agent (highlighted) -->
  <rect fill="#dbeafe" stroke="#2563eb" stroke-width="3" x="201" y="61" width="166" height="62" rx="7"/>
  <text class="name" x="284" y="86">Triage agent</text>
  <text class="sub" x="284" y="106">reachability + risk</text>

  <!-- Policy gate -->
  <polygon fill="#fef3c7" stroke="#d97706" stroke-width="1.8" points="400,92 472,43 545,92 472,141"/>
  <text class="name" x="472" y="89">Policy gate</text>
  <text class="sub" x="472" y="108">plain code</text>
  <text class="lbl" style="fill:#15803d" x="562" y="83">low risk</text>
  <text class="lbl" style="fill:#7e22ce" x="485" y="185">needs review</text>

  <!-- Auto-fix -->
  <rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" x="625" y="61" width="166" height="62" rx="7"/>
  <text class="name" x="708" y="86">Auto-fix</text>
  <text class="sub" x="708" y="106">PR or Copa patch</text>

  <!-- Human review -->
  <rect fill="#f3e8ff" stroke="#9333ea" stroke-width="1.8" x="391" y="227" width="166" height="62" rx="7"/>
  <text class="name" x="474" y="252">Human review</text>
  <text class="sub" x="474" y="272">agent drafts the PR</text>
  <text class="lbl" style="fill:#0f766e" x="590" y="236" text-anchor="middle">approved</text>
  <text class="lbl" style="fill:#dc2626" x="590" y="292" text-anchor="middle">fails</text>

  <!-- Verify -->
  <rect fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8" x="625" y="227" width="166" height="62" rx="7"/>
  <text class="name" x="708" y="252">Verify</text>
  <text class="sub" x="708" y="272">tests, re-scan, sign</text>

  <!-- Dashboard -->
  <rect fill="#fce7f3" stroke="#db2777" stroke-width="1.8" x="391" y="371" width="166" height="62" rx="7"/>
  <text class="name" x="474" y="396">Dashboard</text>
  <text class="sub" x="474" y="416">audit log, MTTR</text>

  <!-- Deploy -->
  <rect fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8" x="625" y="371" width="166" height="62" rx="7"/>
  <text class="name" x="708" y="396">Deploy to AKS</text>
  <text class="sub" x="708" y="416">auto-rollback</text>
</svg>
